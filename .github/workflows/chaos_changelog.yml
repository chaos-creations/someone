# Fork-only: adds the :cl: blocks of the commit messages pushed to purgatory to the Purgatory changelog
# (modular_chaos/html/changelogs/archive/), see modular_chaos/tools/changelog.py
name: Purgatory Changelog
on:
  push:
    branches:
    - purgatory
permissions:
  contents: write
concurrency:
  group: purgatory-changelog
jobs:
  collect:
    name: Collect changelog entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream
        # Commits merged in from upstream carry upstream's own :cl: blocks, which must not end up here
        run: git fetch --no-tags https://github.com/cmss13-devs/cmss13.git master
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deps
        run: python -m pip install PyYaml==6.0.3
      - name: Collect
        run: python modular_chaos/tools/changelog.py collect "${{ github.event.before }}" "${{ github.sha }}" FETCH_HEAD
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain modular_chaos/html/changelogs)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modular_chaos/html/changelogs
          git commit -m "Automatic Purgatory changelog [ci skip]"
          for attempt in 1 2 3; do
            if git push origin HEAD:purgatory; then
              exit 0
            fi
            git fetch origin purgatory
            git rebase FETCH_HEAD
          done
          exit 1
