2026-11-02:
  Taushai:
  - rscadd: 'Добавлен человеческий ИИ (hAI): гейм-мастеры с правами Debug создают
      ИИ-людей из любых пресетов снаряжения, отряды, пулемётные гнёзда и снайперские
      посты.'
  - rscadd: ИИ-люди ходят между этажами по лестницам и стремянкам и видят и обстреливают
      противников через проёмы между уровнями.
  - rscadd: ИИ-люди умеют вести огонь из станковых пулемётов M56D и M2C.
  - rscadd: ИИ-медики (с навыком медика и анализатором здоровья) лечат раненых союзников
      раньше, чем стреляют, держатся позади отряда и оттаскивают лежачих раненых из-под
      огня.
  - rscadd: ИИ-люди с ломом взламывают шлюзы, к которым у них нет доступа; без лома
      такие шлюзы для них непроходимы.
  - admin: Режим строительства (buildmode) у призрака больше не срабатывает дважды
      за один клик.
