2026-11-02:
  Taushai:
  - rscadd: 'Добавлен человеческий ИИ (hAI): гейм-мастеры с правами Debug создают
      ИИ-людей из любых пресетов снаряжения, отряды, пулемётные гнёзда и снайперские
      посты.'
  - rscadd: ИИ-люди ходят между этажами по лестницам и стремянкам и видят и обстреливают
      противников через проёмы между уровнями.
  - rscadd: ИИ-люди умеют вести огонь из станковых пулемётов M56D и M2C.
  - rscadd: ИИ-медики (с навыком медика и анализатором здоровья) лечат раненых союзников
      раньше, чем стреляют, держатся позади отряда и оттаскивают лежачих раненых из-под
      огня.
  - rscadd: ИИ-люди с ломом взламывают шлюзы, к которым у них нет доступа; без лома
      такие шлюзы для них непроходимы.
  - admin: Режим строительства (buildmode) у призрака больше не срабатывает дважды
      за один клик.
  - rscadd: 'Добавлена кнопка «Важное действие» рядом со слотом головы и одноимённое
      действие во вкладке IC: действие выделяется в эмоуте и отправляется гейм-мастерам.'
  - rscadd: Через меню раздевания теперь можно открыть чужой рюкзак, пояс, подсумки,
      разгрузку и карманы брони, чтобы взять или положить вещи.
  - rscadd: 'Добавлен режим смещения (клавиша J или Pixel Shift во вкладке IC): клавиши
      движения плавно сдвигают персонажа в пределах клетки, а предметы рядом можно
      двигать мышью. Часть персонажа или предмета, заходящая на стену с юга, прячется
      за ней.'
  - admin: 'Добавлено меню Nightmare (Game Master → Extras): выбор сценария, принудительная
      загрузка и блокировка вставок, прыжок к ним и предпросмотр до начала раунда.'
  - admin: Добавлен переключатель Toggle Admin Only Observe (Game Master → Flags),
      закрывающий игрокам наблюдение.
